name: Cabaz diário

on:
  schedule:
    # Três execuções por dia (UTC; o GitHub costuma atrasá-las várias horas).
    # A primeira do dia recolhe tudo; as seguintes só o que faltar (por exemplo,
    # se uma loja bloqueou o IP do servidor anterior). Sem nada em falta,
    # terminam em segundos e não fazem commit.
    - cron: "17 8 * * *"
    - cron: "47 13 * * *"
    - cron: "17 19 * * *"
  workflow_dispatch:        # permite correr à mão no separador Actions
    inputs:
      completa:
        description: "Recolher tudo outra vez (em vez de só o que falta hoje)"
        type: boolean
        default: false

permissions:
  contents: write   # gravar os dados no repositório
  issues: write     # abrir issues com alertas

concurrency:
  group: cabaz-diario
  cancel-in-progress: false

jobs:
  recolher:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Testes
        run: python -m unittest discover -s tests -v

      - name: Recolher preços e gerar relatório
        id: rec
        env:
          MODO: ${{ inputs.completa && ' ' || '--so-em-falta' }}
        run: python -m cabaz.agente $MODO --registo "$RUNNER_TEMP/registo.json"

      - name: Gravar no repositório
        run: |
          git config user.name  "cabaz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ RELATORIO*.md docs/
          if git diff --cached --quiet; then
            echo "Sem alterações."
          else
            git commit -m "Preços do cabaz: $(TZ=Europe/Lisbon date +%F)"
            git push
          fi

      - name: Verificar qualidade da recolha
        id: verif
        # só os preços novos desta execução; crítico só se o dia anterior terminou incompleto
        run: python -m cabaz.verificacao --registo "$RUNNER_TEMP/registo.json" --saida "$RUNNER_TEMP/verificacao"

      - name: Abrir issue com alertas
        if: steps.verif.outputs.critico == 'true' || steps.verif.outputs.suspeito == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DATA: ${{ steps.verif.outputs.data }}
          CORPO: ${{ runner.temp }}/verificacao/issue.md
        run: |
          titulo="Alertas do cabaz: $DATA"
          echo "" >> "$CORPO"
          echo "Execução: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$CORPO"
          gh label create alerta-cabaz --color D93F0B --description "Alertas automáticos da recolha de preços" --force
          num=$(gh issue list --state open --label alerta-cabaz --search "in:title \"$titulo\"" --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file "$CORPO"
          else
            gh issue create --title "$titulo" --label alerta-cabaz --body-file "$CORPO"
          fi

      - name: Resumo
        if: always()
        run: test -f RELATORIO.md && cat RELATORIO.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Falhar se houver problemas críticos
        if: steps.verif.outputs.critico == 'true'
        run: |
          echo "::error::Um dia terminou com a recolha incompleta — ver a issue 'Alertas do cabaz: ${{ steps.verif.outputs.data }}'"
          exit 1
