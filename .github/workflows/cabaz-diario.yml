name: Cabaz diário

on:
  schedule:
    - cron: "17 8 * * *"   # todos os dias às 08:17 UTC (≈ 8h/9h em Lisboa)
  workflow_dispatch: {}     # permite correr à mão no separador Actions

permissions:
  contents: write   # gravar os dados no repositório
  issues: write     # abrir issues com alertas

concurrency:
  group: cabaz-diario
  cancel-in-progress: false

jobs:
  recolher:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Testes
        run: python -m unittest discover -s tests -v

      - name: Recolher preços e gerar relatório
        run: python -m cabaz.agente

      - name: Gravar no repositório
        run: |
          git config user.name  "cabaz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ RELATORIO.md docs/
          if git diff --cached --quiet; then
            echo "Sem alterações."
          else
            git commit -m "Preços do cabaz: $(TZ=Europe/Lisbon date +%F)"
            git push
          fi

      - name: Verificar qualidade da recolha
        id: verif
        run: python -m cabaz.verificacao --saida "$RUNNER_TEMP/verificacao"

      - name: Abrir issue com alertas
        if: steps.verif.outputs.critico == 'true' || steps.verif.outputs.suspeito == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DATA: ${{ steps.verif.outputs.data }}
          CORPO: ${{ runner.temp }}/verificacao/issue.md
        run: |
          titulo="Alertas do cabaz: $DATA"
          echo "" >> "$CORPO"
          echo "Execução: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$CORPO"
          gh label create alerta-cabaz --color D93F0B --description "Alertas automáticos da recolha de preços" --force
          num=$(gh issue list --state open --label alerta-cabaz --search "in:title \"$titulo\"" --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file "$CORPO"
          else
            gh issue create --title "$titulo" --label alerta-cabaz --body-file "$CORPO"
          fi

      - name: Resumo
        if: always()
        run: test -f RELATORIO.md && cat RELATORIO.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Falhar se houver problemas críticos
        if: steps.verif.outputs.critico == 'true'
        run: |
          echo "::error::Recolha incompleta — ver a issue 'Alertas do cabaz: ${{ steps.verif.outputs.data }}' e o RELATORIO.md"
          exit 1
