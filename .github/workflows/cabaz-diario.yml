name: Cabaz diário

on:
  schedule:
    - cron: "17 8 * * *"   # todos os dias às 08:17 UTC (≈ 8h/9h em Lisboa)
  workflow_dispatch: {}     # permite correr à mão no separador Actions

permissions:
  contents: write

concurrency:
  group: cabaz-diario
  cancel-in-progress: false

jobs:
  recolher:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Testes
        run: python -m unittest discover -s tests -v

      - name: Recolher preços e gerar relatório
        run: python -m cabaz.agente

      - name: Gravar no repositório
        run: |
          git config user.name  "cabaz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ RELATORIO.md docs/
          if git diff --cached --quiet; then
            echo "Sem alterações."
          else
            git commit -m "Preços do cabaz: $(TZ=Europe/Lisbon date +%F)"
            git push
          fi

      - name: Resumo
        if: always()
        run: test -f RELATORIO.md && cat RELATORIO.md >> "$GITHUB_STEP_SUMMARY" || true
