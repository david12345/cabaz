# Cabaz de alimentos base monitorizado diariamente.
#
# Cada [[produto]] é pesquisado em cada supermercado. Dos resultados,
# ficam apenas os que contêm TODAS as palavras de `incluir` e NENHUMA de
# `excluir` (sem distinguir maiúsculas/acentos) e cujo preço unitário está
# na `unidade` indicada (kg, L, un). Escolhe-se o mais barato por unidade.
#
# `comeca` (opcional): o nome do produto tem de começar por este texto — útil
# quando a palavra aparece em muitos outros produtos (ex.: "salsa", "framboesa").
#
# Para seguir sempre o mesmo produto numa loja, fixe o seu código:
#   fixo = { continente = "4421406", auchan = "3010402", pingodoce = "48150" }

# Verificação diária da recolha (ver cabaz/verificacao.py):
#  - abaixo de `cobertura_minima` dos preços esperados, ou uma loja sem preços,
#    o workflow falha (o GitHub envia email);
#  - uma variação de preço por kg/L acima de `variacao_suspeita` face à recolha
#    anterior abre uma issue no GitHub.
[verificacao]
cobertura_minima = 0.90
variacao_suspeita = 0.30

# Cabazes analisados em separado (totais, página e relatório próprios).
# Cada [[produto]] pertence ao cabaz indicado em `cabaz` (por omissão "base").
# O primeiro é a página principal (docs/index.html, RELATORIO.md); os outros
# ficam em docs/<id>.html e RELATORIO-<id>.md.
[cabazes]
base = "Cabaz de alimentos base"
extra = "Cabaz extra"

